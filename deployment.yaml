apiVersion: apps/v1
kind: Deployment
metadata:
  name: foodwaste-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: foodwaste-portal
  template:
    metadata:
      labels:
        app: foodwaste-portal
    spec:
      containers:
        - name: foodwaste-portal
          image: kurellapoojitha/foodwaste:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: foodwaste-service
spec:
  type: NodePort
  selector:
    app: foodwaste-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30015
